    --light: #f8fafc;

html {

body {

    color: var(--dark);

button,
input {

button {

}

a {

.container {

}

/* ================= HEADER ================= */

header {
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.navbar {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    color: var(--dark);
}

.logo span {
    color: var(--primary);
}

.nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
}

.nav-links a {
    font-weight: 600;
    color: var(--text);
}

.nav-links a:hover {
    color: var(--primary);
}

.cart-button {
    background: var(--primary);
    color: white !important;
    padding: 9px 15px;
    border-radius: 10px;
}

.cart-count {
    background: white;
    color: var(--primary);
    border-radius: 20px;
    padding: 2px 7px;
    font-size: 12px;
    margin-left: 4px;
}

/* ================= HERO ================= */

.hero {
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    padding: 80px 0;
}

.hero-content {
    display: grid;
    grid-template-columns: 1.3fr 0.7fr;
    align-items: center;
    gap: 50px;
}

.eyebrow {
    color: var(--primary);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
}

.hero h1 {
    font-size: clamp(40px, 6vw, 65px);
    line-height: 1.05;
    letter-spacing: -3px;
    margin: 15px 0;
}

.hero h1 span {
    color: var(--primary);
}

.hero p {
    color: var(--text);
    font-size: 18px;
    max-width: 600px;
}

.hero-buttons {
    display: flex;
    gap: 12px;
    margin-top: 28px;
}

.btn {
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    font-weight: 800;
    display: inline-block;
}

.primary {
    background: var(--primary);
    color: white;
}

.primary:hover {
    background: var(--primary-dark);
}

.secondary {
    background: white;
    border: 1px solid var(--border);
}

.hero-card {
    height: 300px;
    background: white;
    border-radius: 30px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.hero-card .bag {
    font-size: 110px;
}

.hero-card strong {
    font-size: 18px;
}

/* ================= FEATURES ================= */

.features {
    background: white;
    border-bottom: 1px solid var(--border);
}

.feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 25px 0;
}

.feature {
    display: grid;
    grid-template-columns: 45px 1fr;
    align-items: center;
}

.feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #eff6ff;
    color: var(--primary);
    display: grid;
    place-items: center;
    font-weight: bold;
    grid-row: span 2;
}

.feature strong {
    font-size: 15px;
}

.feature p {
    color: var(--muted);
    font-size: 13px;
}

/* ================= SECTIONS ================= */

.section {

}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 28px;
}

.section-header h2 {
    font-size: 34px;
    margin-top: 7px;
}

.section-header a {
    color: var(--primary);
    font-weight: 800;
}

/* ================= PRODUCTS ================= */

.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.product-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    transition: 0.2s;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow);
}

.product-image {

    background: linear-gradient(135deg, #f1f5f9, #eff6ff);

    place-items: center;
    position: relative;
}

.product-image .emoji {

}

.discount {

    color: #047857;

    border-radius: 8px;

    font-weight: 900;
}

.product-info {

.brand {

.product-info h3 {

.rating {

.unit {

.price-row {

.price-row strong {

.price-row del {

.add-button {

    border: none;
    border-radius: 10px;

/* ================= PAGE HEADER ================= */

/* ================= SEARCH ================= */

.search-box {

.search-box input {

.search-box input:focus {

.search-box button {

.categories {

.category {

/* ================= PRODUCT DETAIL ================= */

.detail {

.detail-image {

.empty {

.empty-icon {

.empty h2 {

.empty p {

/* ================= FOOTER ================= */

footer {

footer p,

.copyright {

    text-align: center;
    padding: 18px;
    color: #64748b;
    font-size: 12px;
}

/* ================= TOAST ================= */

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: var(--dark);
    color: white;
    padding: 13px 18px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    z-index: 999;
    font-weight: bold;
}

/* ================= MOBILE ================= */

@media(max-width: 850px) {

    .product-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero-content,
    .detail,
    .cart-layout {
        grid-template-columns: 1fr;
    }

    .hero-card {
        display: none;
    }

    .feature-grid {
        grid-template-columns: 1fr;
    }

    .footer-grid {
        grid-template-columns: 1fr 1fr;
    }

    .detail-image {
        height: 350px;
    }

    .summary {
        position: static;
    }
}

@media(max-width: 600px) {

    .container {
        width: calc(100% - 24px);
    }

    .nav-links {
        gap: 8px;
    }

    .nav-links a:not(.cart-button) {
        display: none;
    }

    .hero {
        padding: 55px 0;
    }

    .hero h1 {
        font-size: 42px;
    }

    .product-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .product-image {
        height: 145px;
    }

    .product-image .emoji {
        font-size: 58px;
    }

    .product-info {
        padding: 12px;
    }

    .page-header h1 {
        font-size: 38px;
    }

    .search-box button {
        padding: 0 15px;
    }

    .detail h1 {
        font-size: 38px;
    }

    .detail-image span {
        font-size: 125px;
    }

    .cart-item {
        grid-template-columns: 60px 1fr;
    }

    .cart-item > strong {
        grid-column: 2;
    }

    .footer-grid {
        grid-template-columns: 1fr;
    }
}
</style>

/* ================= CART STATE ================= */

let cart = JSON.parse(
    localStorage.getItem("vmMartCart") || "{}"
);

function saveCart() {
    localStorage.setItem(
        "vmMartCart",
        JSON.stringify(cart)
    );
}

function cartCount() {

    return Object.values(cart).reduce(
        (total, quantity) => total + quantity,
        0
    );

}

function addToCart(id) {

    cart[id] = (cart[id] || 0) + 1;

    saveCart();

    showToast("Product added to cart");

    render();

}

function decreaseCart(id) {

    if (!cart[id]) return;

    cart[id]--;

    if (cart[id] <= 0) {
        delete cart[id];
    }

    saveCart();

    render();

}

function removeFromCart(id) {

    delete cart[id];

    saveCart();

    render();

}


/* ================= ROUTER ================= */

function navigate(url) {

    history.pushState({}, "", url);

    render();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

window.addEventListener(
    "popstate",
    render
);


/* ================= ROUTE PARSER ================= */

function getRoute() {

    const url = new URL(
        window.location.href
    );

    return {
        path:
            url.pathname.replace(/\/+$/, "") || "/",

        params:
            url.searchParams
    };

}

/* ================= PRODUCTS PAGE ================= */

function productsPage(params) {

    const query =
        (params.get("q") || "").toLowerCase();

    const selectedCategory =
        params.get("category") || "All";


    const filteredProducts =
        products.filter(product => {

            const matchesSearch =
                !query ||
                `${product.name}
                 ${product.brand}
                 ${product.category}`
                .toLowerCase()
                .includes(query);

            const matchesCategory =
                selectedCategory === "All" ||
                product.category === selectedCategory;

            return (
                matchesSearch &&
                matchesCategory
            );

        });


    return `

<section class="page-header">

<div class="container">

<span class="eyebrow">
PRODUCT CATALOGUE
</span>

<h1>
Shop All Products
</h1>

<p>
Search, filter and find your everyday favourites.
</p>

</div>

</section>


<section class="section">

<div class="container">


<form
    class="search-box"
    id="searchForm"
>

<input
    id="searchInput"
    type="search"
    placeholder="Search products, brands or categories..."
    value="${escapeHTML(query)}"
>

<button type="submit">
Search
</button>

</form>


<div class="categories">

${categories.map(category => `

<button
    class="category ${
        category === selectedCategory
        ? "active"
        : ""
    }"
    onclick="filterCategory('${category}')"
>
${category}
</button>

`).join("")}

</div>


<p style="margin-bottom:20px;color:#64748b">

<strong>
${filteredProducts.length}
</strong>

products found

</p>


${
    filteredProducts.length

    ?

    `<div class="product-grid">
        ${filteredProducts
            .map(productCard)
            .join("")}
    </div>`

    :

    `

    <div class="empty">

        <div class="empty-icon">
            🔎
        </div>

        <h2>
            No products found
        </h2>

        <p>
            Try another search or category.
        </p>

        <a
            href="/products"
            class="btn primary"
            data-link
        >
            View All Products
        </a>

    </div>

    `
}

</div>

</section>

`;

}

                quantity

/* ================= SEARCH ================= */

function searchProducts() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value.trim();

    navigate(
        `/products?q=${encodeURIComponent(query)}`
    );

}


/* ================= CATEGORY FILTER ================= */

function filterCategory(category) {

    navigate(
        `/products?category=${encodeURIComponent(category)}`
    );

}


/* ================= CHECKOUT ================= */

function checkout() {

    alert(
        "Demo checkout successful!\\n\\n" +
        "This capstone demonstrates the frontend " +
        "shopping flow. A real payment gateway/backend " +
        "can be connected for production."
    );

}


/* ================= ESCAPE HTML ================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ================= TOAST ================= */

function showToast(message) {

    const existing =
        document.querySelector(".toast");

    if (existing) {
        existing.remove();
    }


    const toast =
        document.createElement("div");

    toast.className = "toast";

    toast.textContent =
        "✓ " + message;

    document.body.appendChild(toast);


    setTimeout(
        () => toast.remove(),
        1800
    );

}


/* ================= MAIN RENDERER ================= */

function render() {

    const route =
        getRoute();


    let content;


    if (route.path === "/") {

        content =
            homePage();

    }

    else if (
        route.path === "/products"
    ) {

        content =
            productsPage(
                route.params
            );

    }

    else if (
        route.path === "/product"
    ) {

        content =
            productDetailPage(
                route.params
            );

    }

    else if (
        route.path === "/cart"
    ) {

        content =
            cartPage();

    }

    else {

        content = `

        <section class="section">

        <div class="container empty">

        <div class="empty-icon">
            404
        </div>

        <h2>
            Page Not Found
        </h2>

        <p>
            The requested page does not exist.
        </p>

        <a
            href="/"
            class="btn primary"
            data-link
        >
            Go Home
        </a>

        </div>

        </section>

        `;

    }


    document.getElementById(
        "app"
    ).innerHTML =
        layout(content);


    bindLinks();


    const form =
        document.getElementById(
            "searchForm"
        );

    if (form) {

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                searchProducts();

            }
        );

    }

}


/* ================= LINK HANDLING ================= */

function bindLinks() {

    document
        .querySelectorAll(
            "[data-link]"
        )
        .forEach(link => {

            link.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    navigate(
                        this.getAttribute(
                            "href"
                        )
                    );

                }
            );

        });

}


/* ================= INITIAL LOAD ================= */

render();

</script>
